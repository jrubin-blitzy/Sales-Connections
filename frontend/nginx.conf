# =====================================================================
# nginx configuration for the Sales-Connections SPA.
# Served at /etc/nginx/conf.d/default.conf inside the runtime container.
#
# Design objectives:
#   1. History-mode SPA fallback so that client-side routes (e.g., /feed,
#      /admin/users, /connections/123/edit) return index.html and let
#      react-router-dom 6.x take over.
#   2. Aggressive caching for hashed Vite assets (immutable filenames).
#   3. Short or no-cache for index.html so deployments roll out quickly.
#   4. Gzip on for text-based assets to reduce bandwidth.
#   5. Sensible security headers without breaking the SPA's API access.
#   6. /healthz proxy or local liveness for container health.
#
# Notes:
#   - This file is dropped into /etc/nginx/conf.d/ by the runtime stage of
#     frontend/Dockerfile. The parent /etc/nginx/nginx.conf shipped with
#     the nginx:1.27-alpine image already provides the http {} wrapper, so
#     this file contains only a server {} block.
#   - In production, the AWS ALB terminates TLS via ACM and routes /api
#     and /auth traffic directly to the backend ECS service, so this
#     server has no proxy_pass directives. The SPA points at the API base
#     URL via VITE_API_BASE_URL baked at build time.
#   - access_log and error_log are still written to /var/log/nginx/*.log;
#     the parent nginx:alpine image symlinks those paths to /dev/stdout
#     and /dev/stderr so the awslogs Docker driver picks them up.
#   - nginx's add_header has a counterintuitive scoping rule: if a child
#     scope (e.g., a location block) issues ANY add_header, ALL inherited
#     add_header values from the parent scope are dropped. To keep the
#     security headers present on every response, the four security
#     headers are repeated at the top of each location block that issues
#     its own add_header (caching headers, etc.). The server-level copies
#     remain as a baseline for any future location without add_header.
# =====================================================================

server {
    # IPv4 + IPv6 dual-stack listener on port 80. TLS terminates upstream
    # at the ALB; the container itself never serves HTTPS directly.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Vite's `npm run build` output is copied into this directory by the
    # runtime stage of frontend/Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # Disable nginx version disclosure in the Server response header and
    # default error pages. Minor security hardening.
    server_tokens off;

    # Reasonable client body limit. The SPA itself does not POST to nginx
    # (API calls go to the ALB on a different host), but the limit guards
    # against unexpected upload attempts.
    client_max_body_size 1m;

    # ---------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------
    # Compress text-based assets above 1 KB. Vite's bundler emits already-
    # compressed-friendly content, so a comp_level of 6 trades CPU for a
    # solid ~70% reduction on JS/CSS payloads.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # ---------------------------------------------------------------
    # Security headers (server-level baseline)
    # ---------------------------------------------------------------
    # X-Content-Type-Options: stop MIME-sniffing on declared content types.
    # X-Frame-Options: deny iframing - the SPA has no embed use case.
    # Referrer-Policy: send full origin for cross-origin GETs but strip the
    #   path/query, balancing analytics utility with privacy.
    # Permissions-Policy: explicitly deny browser capabilities the app does
    #   not use, reducing the attack surface if a future XSS slips through.
    # Strict-Transport-Security is intentionally OMITTED here - the upstream
    #   ALB sets HSTS at the TLS edge and adding it twice produces duplicate
    #   headers which some browsers and proxies treat as a misconfiguration.
    # These four headers are also repeated inside every location block that
    # has its own add_header, because nginx drops inherited add_header
    # directives whenever the child scope issues any add_header of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------------------------------------------------------------
    # Health endpoint - local liveness for container orchestration
    # ---------------------------------------------------------------
    # The Dockerfile HEALTHCHECK directive hits /healthz, and the ALB
    # target group health check can also use this path for the frontend
    # service. Returning a tiny static body avoids loading the SPA bundle
    # and keeps health checks fast and cheap.
    location = /healthz {
        access_log off;
        # Repeat security headers (see server-level note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    # Static assets - long-term cache (Vite emits content-hashed names)
    # ---------------------------------------------------------------
    # Vite produces filenames like /assets/index-abc123.js where the hash
    # changes whenever content changes, so it is safe to cache for one
    # year with the immutable directive. Browsers will skip revalidation
    # entirely for these URLs.
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif|map)$ {
        expires 1y;
        # Repeat security headers (see server-level note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Bare top-level images / fonts / icons (e.g., /favicon.ico, /favicon.svg).
    # These do not have content hashes in their filenames, so use a one-week
    # cache window - long enough to be effective, short enough that a brand
    # change rolls out quickly.
    location ~* \.(ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|eot|map)$ {
        expires 7d;
        # Repeat security headers (see server-level note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Plain text helpers (robots.txt). Skipped from access logs to reduce noise.
    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # SPA shell - index.html (no-cache so deployments roll out quickly)
    # ---------------------------------------------------------------
    # The shell references content-hashed bundles, so it must always be
    # fetched fresh; otherwise users could load a stale shell that points
    # at JS bundles deleted by the latest deploy.
    location = /index.html {
        # Repeat security headers (see server-level note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # History-mode fallback for client-side routes
    #   /feed, /connections/:id, /admin, /admin/users, etc.
    # ---------------------------------------------------------------
    # try_files first attempts to serve the requested URI as a real file
    # (or directory index), and only falls back to /index.html if neither
    # exists. This lets react-router-dom 6.x own the route table while
    # static files like favicon.svg still resolve correctly.
    location / {
        # Repeat security headers (see server-level note above).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # Hidden files denial
    # ---------------------------------------------------------------
    # Block requests for dotfiles such as /.env, /.git, /.htaccess. The
    # /.well-known/ prefix is preserved in case Let's Encrypt or ALB
    # health checks need it later.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------
    # The nginx:alpine base image symlinks these paths to /dev/stdout and
    # /dev/stderr, so logs flow into the Docker logging driver (awslogs in
    # production, json-file locally). error_log at warn level filters out
    # info-level noise while preserving warnings and errors - appropriate
    # for production CloudWatch ingestion.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
