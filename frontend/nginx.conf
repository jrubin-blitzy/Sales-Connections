# =============================================================================
# Sales-Connections Frontend - nginx SPA configuration
# =============================================================================
# - History-mode fallback: every unknown route resolves to /index.html so
#   react-router-dom can take over.
# - Aggressive cache headers for hashed assets, no-cache for index.html.
# - Gzip enabled for text-y assets.
# - Healthz endpoint for the container HEALTHCHECK directive.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Logging - directed to stdout/stderr by the parent nginx.conf so the
    # awslogs Docker driver picks them up.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Security headers (lightweight; full CSP belongs at the ALB/CDN tier).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache hashed JS/CSS aggressively.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Healthcheck - returns 200 OK from nginx without hitting the SPA bundle.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache index.html so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
