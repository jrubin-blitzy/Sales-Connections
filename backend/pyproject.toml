[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-connections-backend"
version = "0.1.0"
description = "Sales-Connections backend - Flask 3.1.3 + SQLAlchemy 2.x + Anthropic Claude"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Sales-Connections Team" }]

[project.urls]
Homepage = "https://github.com/example/sales-connections"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "migrations/versions",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Curated rule set: pycodestyle + pyflakes + isort + bugbear + simplify
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4"]
ignore = [
    "E501",  # line length is enforced by `line-length` above
    "B008",  # Function calls in argument defaults (Flask/FastAPI idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "N802", "N803"]
"migrations/**/*.py" = ["E", "F", "I", "B", "UP", "SIM", "N", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (advisory static typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
follow_imports = "silent"
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/observability/tracing.py",
    "app/__init__.py",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false
