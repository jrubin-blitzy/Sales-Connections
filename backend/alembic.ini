# =============================================================================
# Alembic configuration for the Sales-Connections backend.
# =============================================================================
#
# This file is the entry point for the Alembic CLI; without it, every
# `alembic` invocation fails with "No 'script_location' key found in
# configuration." (See QA Issue #2 from Checkpoint 2.)
#
# Per AAP §0.5.2 Layer 0, Alembic owns the DDL lifecycle for the
# six-table schema (organizations, users, records, tags, record_tags,
# audit_events) plus the role-provisioning grants documented in AAP
# §0.4.7. The migrations themselves live under ``backend/migrations/``;
# this file simply tells Alembic where to find them and how to log.
#
# Key relationships
# -----------------
# * ``script_location = migrations``  -- Resolved RELATIVE TO this ini
#   file (Alembic prepends the ini file's directory to relative paths).
#   When the file lives at ``backend/alembic.ini`` and ``alembic`` is
#   invoked from the ``backend/`` directory, this resolves to
#   ``backend/migrations/`` exactly. When invoked from the repo root via
#   ``alembic -c backend/alembic.ini upgrade head``, it still resolves
#   to ``backend/migrations/`` because Alembic uses the ini file's own
#   location as the base.
#
# * ``prepend_sys_path = .``  -- Added so ``from app.<module> import``
#   resolves when ``alembic`` is invoked from within the ``backend/``
#   directory. The ``migrations/env.py`` script ALSO performs an
#   explicit ``sys.path.insert(0, _BACKEND_DIR)`` so this directive is
#   defense-in-depth, NOT load-bearing.
#
# * ``timezone = UTC``  -- Forces Alembic to render migration script
#   timestamps in UTC. Aligned with the project-wide convention that
#   every datetime in the system is timezone-aware UTC (per AAP §0.4.6
#   audit-event timestamp invariant and the ``DateTime(timezone=True)``
#   columns declared on every model).
#
# * ``sqlalchemy.url``  -- INTENTIONALLY OMITTED. The active DSN is
#   resolved at runtime by ``backend/migrations/env.py`` from the
#   environment variables ``MIGRATIONS_DATABASE_URL`` (preferred,
#   elevated migrations role) and ``DATABASE_URL`` (fallback,
#   application role). Hard-coding a DSN here would bypass the
#   environment-driven resolution and risk leaking credentials into the
#   repository.
#
# Logging
# -------
# The [loggers] / [handlers] / [formatters] sections below are consumed
# by Alembic's ``fileConfig()`` call inside ``migrations/env.py`` to
# initialize the standard library logging system BEFORE migrations run.
# Migration scripts that emit ``alembic.context.config.attributes``
# diagnostic messages flow through these handlers; the project's
# structlog setup (configured in ``app.observability.logging``) is
# overlaid AFTER ``fileConfig()`` so JSON-formatted log lines are
# emitted to stderr during migrations as well as during runtime.

[alembic]
# Path to the migrations directory, relative to this ini file's
# location (``backend/``). ``backend/migrations/`` contains
# ``env.py``, ``script.py.mako``, and ``versions/`` with the two
# numbered migration files.
script_location = migrations

# Add the directory containing this ini file (i.e., ``backend/``) to
# the front of ``sys.path`` so ``from app.<module> import ...``
# resolves correctly. Defense-in-depth: ``migrations/env.py`` ALSO
# performs an explicit ``sys.path.insert(0, _BACKEND_DIR)`` so this
# directive is redundant in the common case but keeps custom-ini
# invocations from breaking.
prepend_sys_path = .

# Render every timestamp Alembic emits (rev IDs, file headers) in UTC
# so migration files are deterministic across operator timezones.
# Required by the project-wide UTC-only datetime convention.
timezone = UTC

# When True, Alembic prepends the current date to each new revision
# file's name (e.g., 2026_05_03_HHMM_initial_schema.py). The project
# uses ``%%(slug)s`` only naming (``script.py.mako`` does not embed a
# date prefix) so we leave this False.
# revision_environment = false

# When True, Alembic loads ``script.py.mako`` from the migrations
# directory rather than the templates packaged with Alembic. The
# project provides its own ``script.py.mako`` so this is implicit but
# making it explicit avoids confusion.
# sourceless = false

# Comma-separated list of ``script_location`` paths in load order. We
# use a single path so this is left empty.
# version_locations = %(here)s/migrations/versions

# Default version path separator (used by ``alembic revision``). Left
# at the default ``os.pathsep`` (colon on POSIX, semicolon on Windows).
# version_path_separator = os

# Custom configuration the project's ``env.py`` reads via
# ``context.config.get_main_option(...)``. None defined currently;
# new entries should be documented inline.

# -----------------------------------------------------------------------------
# Logging configuration (consumed by fileConfig() in env.py)
# -----------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# WARN suppresses INFO-level SQL echo at runtime. Use ``-q`` on the
# Alembic CLI to silence further; use ``-v`` to bump to INFO.
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO so ``alembic upgrade head`` emits the migration step lines
# (e.g., "Running upgrade  -> 0001, initial_schema") which operators
# rely on to confirm the migration ran.
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
